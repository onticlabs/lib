[project]
name = "ontic-lib"
version = "0.5.0"
description = "Ontic shared library: fan-out tracking shim, eval harnesses, geometry/depth utils, stable model code"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "numpy>=1.24", "torch>=2.4", "torchmetrics>=1.4"]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
torch = []  # compatibility alias; torch is now a core dependency
e3nn = ["e3nn>=0.5"]  # only needed for geometry.spherical_harmonics rotation (wigner_D)

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontic_lib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
