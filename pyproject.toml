[project]
name = "ontic-lib"
version = "0.3.0"
description = "Ontic shared library: fan-out tracking shim, eval harnesses, stable model code"
requires-python = ">=3.12"
dependencies = ["trackio>=0.1", "pyyaml>=6", "numpy>=1.24"]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
torch = ["torch>=2.4"]  # for ontic_lib.metrics3d (import the submodule explicitly)

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontic_lib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
