[project]
name = "ontic-lib"
version = "0.5.0"
description = "Ontic shared library: fan-out tracking shim, eval harnesses, geometry/depth utils, stable model code"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
 "numpy>=1.24",
 "torch>=2.4",
 "torchmetrics>=1.4",
 "roma>=1.5",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
e3nn = ["e3nn>=0.5"]  # only needed for splats.sh spherical-harmonic rotation (wigner_D)
gsplat = ["gsplat>=1.4"]  # only needed for splats.rendering (CUDA rasterization)
cute = ["gsplat>=1.4", "nvidia-cutlass-dsl>=4.0"]  # splats.cute batched CuTeDSL rasterizer
safetensors = ["safetensors>=0.4"]  # io: .safetensors particle files
ply = ["plyfile>=1.0"]  # io: .ply particle files
all = ["ontic-lib[wandb,e3nn,gsplat,safetensors,ply]"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "torch>=2.4", "ontic-nn[ptv3]", "ontic-data", "ontic-viz"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ontic-nn = { workspace = true }
ontic-data = { workspace = true }
ontic-viz = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontic_lib"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "packages/ontic-nn/src", "packages/ontic-nn/tests", "packages/ontic-data/src", "packages/ontic-data/tests", "packages/ontic-viz/src", "packages/ontic-viz/tests"]
extend-exclude = ["ext"]  # vendored CUDA extension sources keep their upstream style

[tool.pytest.ini_options]
testpaths = ["tests", "packages/ontic-nn/tests", "packages/ontic-data/tests", "packages/ontic-viz/tests"]
addopts = "--import-mode=importlib"
