[project]
name = "ontic-viz"
version = "0.5.0"
description = "Ontic interactive tools: the backbone 3D viewer (viser) over ontic-nn wrappers and ontic-data datasets"
requires-python = ">=3.10"
dependencies = [
    "ontic-lib",
    "ontic-nn",
    "ontic-data",
    "torch>=2.4",
    "numpy>=1.24",
    "viser>=1.1",  # GuiApi.add_panel and current playback controls
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[project.optional-dependencies]
rerun = ["rerun-sdk>=0.38,<0.39"]  # optional headless tracking recordings
robot = ["mujoco>=3.1"]  # robot model overlay in the backbone viewer

[project.scripts]
ontic-backbone-viewer = "ontic_viz.backbone_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontic_viz"]

[tool.uv.sources]
ontic-lib = { workspace = true }
ontic-nn = { workspace = true }
ontic-data = { workspace = true }
